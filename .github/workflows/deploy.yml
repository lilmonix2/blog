name: Build and deploy Docker image

on:
  push:
    branches:
      - main

concurrency:
  group: blog-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build environment file
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_GISCUS_REPO=${{ secrets.NEXT_PUBLIC_GISCUS_REPO }}
          NEXT_PUBLIC_GISCUS_REPOSITORY_ID=${{ secrets.NEXT_PUBLIC_GISCUS_REPOSITORY_ID }}
          NEXT_PUBLIC_GISCUS_CATEGORY=${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY }}
          NEXT_PUBLIC_GISCUS_CATEGORY_ID=${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ixjs-blog:${{ github.sha }}
          platforms: linux/amd64
          secret-files: |
            env_local=.env.local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save ixjs-blog:${{ github.sha }} | gzip > docker-image.tar.gz

      - name: Upload image and Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: docker-image.tar.gz,compose.yaml,scripts/restart-service.sh
          target: /opt/docker-services/blog

      - name: Restart Docker service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -eu
            cd /opt/docker-services/blog
            bash ./scripts/restart-service.sh 'ixjs-blog:${{ github.sha }}'
