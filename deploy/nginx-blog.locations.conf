# Include inside the existing ixjs.com server block after replacing any duplicate /static location.
# ^~ prevents legacy extension-based locations (png/jpg/css/...) from serving files from an old root.
location ^~ /static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
